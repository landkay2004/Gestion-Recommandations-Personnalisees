{% extends 'base.html' %}
{% block title %}Supprimer la séance{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item"><a href="{% url 'planning_list' %}">Planning</a></li><li class="breadcrumb-item active">Supprimer</li>{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title text-danger"><i class="bi bi-trash-fill me-2"></i>Supprimer la séance</h1></div>
<div class="card" style="max-width:480px">
  <div class="card-body">
    <p>Confirmer la suppression de la séance <strong>{{ obj }}</strong> ?</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Supprimer</button>
      <a href="{% url 'planning_list' %}" class="btn btn-outline-secondary">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
