<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Console plateforme — {{ platform_settings.site_name|default:"EducNet" }}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: #0b1120;
    }
    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
    }

    .login-fullbg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        linear-gradient(160deg, rgba(10,16,40,.82) 0%, rgba(10,16,40,.72) 45%, rgba(10,16,40,.88) 100%),
        {% if platform_settings.login_bg_1 %}
        url('{{ platform_settings.login_bg_1.url }}') center/cover no-repeat;
        {% else %}
        linear-gradient(135deg, #1e1b4b 0%, #312e81 30%, #1e3a5f 60%, #0c1b33 100%);
        {% endif %}
    }
    .login-fullbg::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(99,102,241,.18) 0%, transparent 48%),
        radial-gradient(circle at 80% 80%, rgba(59,130,246,.16) 0%, transparent 45%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .login-center-wrap {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-center-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-center-brand-mark {
      width: 66px;
      height: 66px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #4d44b5;
      box-shadow: 0 10px 30px rgba(77,68,181,.45);
      overflow: hidden;
    }
    .login-center-brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
      background: #fff;
    }
    .login-center-brand-name {
      color: #fff;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 26px 70px rgba(5,3,30,.5);
    }
    .login-form-heading {
      font-size: 1.85rem;
      font-weight: 800;
      text-align: center;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .login-form-sub {
      font-size: .88rem;
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
    }
    .login-field-wrap {
      position: relative;
    }
    .login-field-wrap .form-control,
    .login-field-wrap input.form-control {
      background: #f8fafc !important;
      border: 1.5px solid #e2e8f0 !important;
      font-size: .875rem;
      height: 46px;
      border-radius: 10px;
      padding-right: 2.8rem;
    }
    .login-field-wrap .form-control:focus,
    .login-field-wrap input.form-control:focus {
      border-color: #4d44b5 !important;
      background: #fff !important;
      box-shadow: 0 0 0 3px rgba(77,68,181,.12) !important;
    }
    .login-field-icon {
      position: absolute;
      right: .85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
    }
    .login-field-eye {
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 4px;
      color: #94a3b8;
      cursor: pointer;
      z-index: 5;
      line-height: 1;
    }
    .login-field-eye:hover { color: #4d44b5; }
    .login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: .82rem 1.4rem;
      background: linear-gradient(90deg, #4d44b5 0%, #6366f1 100%);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: .925rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(77,68,181,.32);
      margin-top: 22px;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(77,68,181,.38);
    }
    .login-bottom-link {
      text-align: center;
      margin-top: 20px;
      font-size: .78rem;
      color: #64748b;
    }
    .login-bottom-link a {
      color: #4d44b5;
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 800px) {
      html, body { overflow: auto; }
      .login-center-wrap { padding: 28px 16px; }
      .login-glass-card { padding: 28px 22px; }
      .login-form-heading { font-size: 1.45rem; }
    }
  </style>
</head>
<body>

<div class="login-fullbg"></div>

<div class="login-center-wrap">
  <div>
    <div class="login-center-brand">
      <div class="login-center-brand-mark">
        {% if platform_settings.site_logo %}
          <img src="{{ platform_settings.site_logo.url }}" alt="Logo">
        {% else %}
          <i class="bi bi-stars" style="color:#fff;font-size:1.45rem;"></i>
        {% endif %}
      </div>
      <div class="login-center-brand-name">{{ platform_settings.site_name|default:"EducNet" }}</div>
    </div>

    <div class="login-glass-card">
      <div class="login-form-heading">Connexion administrateur</div>
      <div class="login-form-sub">Accès réservé aux super-administrateurs</div>

      {% if error %}
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3" style="border-radius:10px;font-size:.82rem;">
        <i class="bi bi-x-circle-fill flex-shrink-0"></i>{{ error }}
      </div>
      {% endif %}

      <form method="post" novalidate id="loginForm">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:.8rem;color:#0f172a;">Adresse e-mail <span style="color:#ef4444;">*</span></label>
          <div class="login-field-wrap">
            <input type="email" name="email" id="id_email" class="form-control"
                   placeholder="admin@plateforme.local" autofocus
                   value="{{ form.email.value|default:'' }}">
            <i class="bi bi-envelope login-field-icon"></i>
          </div>
        </div>

        <div class="mb-1">
          <label class="form-label fw-semibold" style="font-size:.8rem;color:#0f172a;">Mot de passe <span style="color:#ef4444;">*</span></label>
          <div class="login-field-wrap">
            <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••">
            <button type="button" class="login-field-eye" onclick="togglePwd()" aria-label="Afficher/masquer">
              <i class="bi bi-eye" id="pwd-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i>Se connecter
        </button>
      </form>

      <div class="login-bottom-link mt-4">
        <a href="/login/"><i class="bi bi-arrow-left me-1"></i>Retour vers l'espace établissement</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd() {
  const inp = document.getElementById('id_password');
  const eye = document.getElementById('pwd-eye');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  eye.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
}
document.getElementById('loginForm')?.addEventListener('submit', function() {
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm" style="width:14px;height:14px;"></span> Connexion…';
});
</script>
</body>
</html>
