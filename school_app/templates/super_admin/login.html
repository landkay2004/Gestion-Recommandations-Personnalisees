<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super-Admin — Connexion — SGN RDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0F172A; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box {
      background: #1E293B; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .login-box h1 { color: #fff; font-size: 1.5rem; font-weight: 700; }
    .login-box .subtitle { color: #94A3B8; font-size: .875rem; }
    .form-control { background: #0F172A; border: 1px solid #334155; color: #F1F5F9; }
    .form-control:focus { background: #0F172A; border-color: #2563EB; color: #F1F5F9; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
    label { color: #CBD5E1; font-size: .85rem; }
    .badge-sa { background: #2563EB; color: #fff; font-size: .65rem; padding: .2rem .6rem; border-radius: 4px; font-weight: 600; letter-spacing: .08em; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="d-flex align-items-center gap-2 mb-3">
    <i class="bi bi-shield-lock-fill text-primary fs-4"></i>
    <div>
      <span class="badge-sa">SUPER-ADMIN</span>
      <h1 class="mb-0 mt-1">Plateforme SGN RDC</h1>
    </div>
  </div>
  <p class="subtitle mb-4">Acces reserve aux administrateurs de la plateforme</p>

  {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2">
      <i class="bi bi-x-circle-fill"></i> {{ error }}
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_email">Adresse email</label>
      <input type="email" name="email" id="id_email" class="form-control mt-1"
             placeholder="superadmin@sgn-rdc.local" autofocus
             value="{{ form.email.value|default:'' }}">
    </div>
    <div class="mb-4">
      <label for="id_password">Mot de passe</label>
      <input type="password" name="password" id="id_password" class="form-control mt-1" placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
      <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
    </button>
  </form>

  <div class="mt-3 text-center">
    <a href="/login/" class="text-secondary" style="font-size:.8rem;">
      <i class="bi bi-arrow-left"></i> Espace etablissement
    </a>
  </div>
</div>
</body>
</html>
