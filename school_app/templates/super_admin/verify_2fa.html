<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification 2FA — SGN RDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0F172A; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { background: #1E293B; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .box h2 { color: #fff; }
    .form-control { background: #0F172A; border: 1px solid #334155; color: #F1F5F9; text-align: center; font-size: 1.5rem; letter-spacing: .5rem; }
    .form-control:focus { background: #0F172A; border-color: #2563EB; color: #F1F5F9; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
    label { color: #94A3B8; }
  </style>
</head>
<body>
<div class="box text-center">
  <i class="bi bi-shield-lock-fill text-primary mb-3" style="font-size:2.5rem"></i>
  <h2 class="fw-bold mb-1">Verification 2FA</h2>
  <p class="text-secondary mb-4">Entrez le code genere par votre application d'authentification</p>
  {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="form-label">Code a 6 chiffres</label>
      {{ form.code }}
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"><i class="bi bi-shield-check me-1"></i>Verifier</button>
  </form>
  <div class="mt-3">
    <small class="text-secondary">Vous pouvez aussi entrer un code de recuperation.</small>
  </div>
  <a href="{% url 'super_admin:logout' %}" class="d-block mt-3 text-secondary text-decoration-none">
    <i class="bi bi-box-arrow-left me-1"></i>Deconnexion
  </a>
</div>
</body>
</html>
