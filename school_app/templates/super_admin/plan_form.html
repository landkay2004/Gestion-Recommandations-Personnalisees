{% extends "super_admin/base.html" %}
{% block title %}{{ titre }}{% endblock %}
{% block page_title %}<i class="bi bi-award me-2 text-primary"></i>{{ titre }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="kpi-card">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label fw-semibold">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 justify-content-end mt-4">
          <a href="{% url 'super_admin:plan_list' %}" class="btn btn-outline-secondary">Annuler</a>
          <button type="submit" class="btn btn-sa-primary"><i class="bi bi-check-circle me-1"></i>Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
