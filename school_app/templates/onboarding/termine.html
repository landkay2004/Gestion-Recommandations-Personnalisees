<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuration terminee — SGN RDC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; }
    .box { background: #fff; border-radius: 20px; padding: 3rem 2rem; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.08); }
    .check-circle { width: 80px; height: 80px; background: #DCFCE7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  </style>
</head>
<body>
<div class="box">
  <div class="check-circle">
    <i class="bi bi-check-lg text-success" style="font-size:2.5rem"></i>
  </div>
  <h2 class="fw-bold mb-2">Configuration terminee !</h2>
  <p class="text-muted mb-4">
    Bienvenue sur la plateforme SGN RDC.<br>
    Votre espace <strong>{{ ecole.nom }}</strong> est pret. Commencez par configurer vos classes, eleves et enseignants.
  </p>
  <a href="/dashboard/" class="btn btn-primary btn-lg w-100 mb-3">
    <i class="bi bi-grid-fill me-2"></i>Acceder au tableau de bord
  </a>
  <a href="/parametres/" class="btn btn-outline-secondary w-100">
    <i class="bi bi-gear me-2"></i>Parametres de l'ecole
  </a>
</div>
</body>
</html>
